name: Price eval

on:
  pull_request:
    paths:
      - "lib/prompts/**"
      - "lib/masters/**"
      - "lib/extractor.ts"
      - "lib/responder.ts"
      - "lib/campaignFlow.ts"
      - "lib/campaigns.ts"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "lib/prompts/**"
      - "lib/masters/**"
      - "lib/extractor.ts"
      - "lib/responder.ts"
      - "lib/campaignFlow.ts"
      - "lib/campaigns.ts"
      - "scripts/**"
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run eval:price
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npm run eval:dialog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npm run eval:campaign-dialog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npm run eval:price:platon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npm run eval:dialog:platon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
