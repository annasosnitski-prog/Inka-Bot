name: Price eval

on:
  pull_request:
    paths:
      - "lib/extractorPrompt.txt"
      - "lib/extractor.ts"
      - "scripts/priceEval.ts"
  push:
    branches: [main]
    paths:
      - "lib/extractorPrompt.txt"
      - "lib/extractor.ts"
      - "scripts/priceEval.ts"
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run eval:price
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
